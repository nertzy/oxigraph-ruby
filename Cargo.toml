# This Cargo.toml is here to let externals tools (IDEs, etc.) know that this is
# a Rust project. Your extensions dependencies should be added to the Cargo.toml
# in the ext/ directory.

[workspace]
members = ["./ext/oxigraph"]
resolver = "2"

[profile.release]
# Debug information made each Linux and Windows extension about 100 MB.
# Stripping it keeps the symbol table, so a backtrace still names functions;
# it loses file names and line numbers.
strip = "debuginfo"
