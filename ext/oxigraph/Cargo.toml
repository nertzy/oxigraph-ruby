[package]
name = "oxigraph"
version = "0.1.0"
edition = "2021"
authors = ["Grant Hutchins <gems@nertzy.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.9" }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }

[build-dependencies]
rb-sys-env = "0.2.2"
