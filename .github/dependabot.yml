# Each ecosystem waits one day after a release before proposing it, instead of
# the three days Dependabot waits by default. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      bundler-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns: ["*"]
