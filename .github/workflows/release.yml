---
name: Release

# A pushed version tag builds every gem, installs each precompiled one on its
# own platform, and then waits for approval before publishing. A manual run,
# even one started from a tag, or a pull request that changes this workflow,
# does everything but publish.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - script/verify_native_gem.rb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every job that builds a gem waits for this one, so a tag that cannot be
  # released stops the run before anything is built.
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"

      - name: Confirm the tag names the version being built
        if: github.ref_type == 'tag'
        run: >
          ruby -Ilib -roxigraph/version -e
          'abort "the tag is #{ENV.fetch("GITHUB_REF_NAME")}, the gem is #{Oxigraph::VERSION}"
          unless ENV.fetch("GITHUB_REF_NAME") == "v#{Oxigraph::VERSION}"'

      # A release candidate has no changelog section and gets no GitHub
      # Release; a final version must have its release notes written.
      - name: Tell a final version from a release candidate
        id: version
        if: github.ref_type == 'tag'
        run: >
          ruby -Ilib -roxigraph/version -e
          'puts "prerelease=#{Gem::Version.new(Oxigraph::VERSION).prerelease?}"'
          >> "$GITHUB_OUTPUT"

      - name: Require release notes for a final version
        if: steps.version.outputs.prerelease == 'false'
        run: ruby script/release_notes.rb "${GITHUB_REF_NAME#v}"

  ci-data:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        id: fetch
        with:
          # arm-linux-musl is left out because no rb-sys cross-compilation
          # image is published for it.
          supported-ruby-platforms: |
            exclude: ["arm-linux", "arm-linux-musl", "x64-mingw32"]

  source-gem:
    runs-on: ubuntu-latest
    needs: check-tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cargo-cache: true
          # The setup action saves the Cargo cache as it finishes unless this is
          # false, which is before anything compiles. Saved at the end of the job,
          # the cache holds the compiled dependencies.
          cache-save-always: false
          cache-version: v1-source-gem

      - name: Build gem
        run: bin/rake build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-gem
          path: pkg/*.gem

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: [check-tag, ci-data]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.4,4.0"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  # Installs every precompiled gem on its own platform and uses it. A platform
  # that cross-gem builds and this matrix does not map to a runner fails here,
  # so no gem is published without having been loaded.
  verify-native-gem:
    name: Install ${{ matrix.platform }} gem on Ruby ${{ matrix.ruby }}
    needs: [ci-data, cross-gem]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
        ruby: ["3.4", "4.0"]
        include:
          # A Linux gem is installed in a container that has no Rust toolchain
          # and no C compiler, so it cannot pass by compiling.
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
            image: slim
          - platform: x86_64-linux
            runner: ubuntu-latest
            image: slim
          - platform: aarch64-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine
          - platform: x86_64-linux-musl
            runner: ubuntu-latest
            image: alpine
          - platform: arm64-darwin
            runner: macos-latest
          - platform: x86_64-darwin
            runner: macos-15-intel
          - platform: x64-mingw-ucrt
            runner: windows-latest
          - platform: aarch64-mingw-ucrt
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-gem-${{ matrix.platform }}
          path: pkg

      - name: Install and use the gem in a container
        if: matrix.image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ruby:${{ matrix.ruby }}-${{ matrix.image }}
        run: >
          docker run --rm --env PLATFORM --env EXPECT_NO_COMPILER=1
          --volume "$PWD:/work:ro" --workdir /work "$IMAGE"
          ruby script/verify_native_gem.rb pkg

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: ${{ !matrix.image }}
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install and use the gem
        if: ${{ !matrix.image }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ruby script/verify_native_gem.rb pkg

  # Publishes the gems the jobs above built and installed, not a rebuild of
  # them. The release environment holds this job until a reviewer approves it.
  # Only a pushed tag publishes: a manual run started from a tag does not.
  publish:
    name: Publish to RubyGems
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [source-gem, verify-native-gem]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing and the Sigstore signatures
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg
          merge-multiple: true

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"

      # Every gem is signed before any is pushed, so a signing failure
      # publishes nothing.
      - name: Sign the gems
        run: |
          for gem in pkg/*.gem; do
            gem exec sigstore-cli:0.2.3 sign "$gem" --bundle "$gem.sigstore.json"
          done

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # A gem RubyGems already has is skipped, so a run that failed partway
      # can be run again to push the rest.
      - name: Push the gems
        run: |
          for gem in pkg/*.gem; do
            published=$(ruby -rrubygems/package -e '
              spec = Gem::Package.new(ARGV.fetch(0)).spec
              print "https://rubygems.org/api/v2/rubygems/#{spec.name}/versions/#{spec.version}.json?platform=#{spec.platform}"
            ' "$gem")
            if curl --fail --silent --output /dev/null "$published"; then
              echo "$gem is already published"
            else
              gem push "$gem" --attestation "$gem.sigstore.json"
            fi
          done

  # A final version gets a GitHub Release whose notes are its section of the
  # changelog. A release candidate gets none.
  github-release:
    name: Create the GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.check-tag.outputs.prerelease == 'false'
    needs: [check-tag, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"

      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby script/release_notes.rb "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
