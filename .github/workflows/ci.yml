name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cargo-cache: true
          # The setup action saves the Cargo cache as it finishes unless this is
          # false, which is before anything compiles. Saved at the end of the job,
          # the cache holds the compiled dependencies.
          cache-save-always: false
          # Clippy's build output is not the test jobs', so each keeps its own.
          cache-version: v1-lint
      - run: bin/rake standard cargo:fmt cargo:clippy
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) \
            1.7.12 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: actionlint

  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which cannot run the scripts in bin/.
    defaults:
      run:
        shell: bash
    env:
      # The setup action tells bindgen to target x64 on every Windows runner. This
      # name is read only by a build for ARM Windows, where it takes precedence.
      BINDGEN_EXTRA_CLANG_ARGS_aarch64_pc_windows_gnullvm: --target=aarch64-w64-windows-gnu
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby and Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: ${{ matrix.ruby }}
          # The action derives an x64 toolchain for every Windows Ruby, so name the ARM one.
          rustup-toolchain: ${{ matrix.os == 'windows-11-arm' && 'stable-aarch64-pc-windows-gnullvm' || 'stable' }}
          bundler-cache: true
          cargo-cache: true
          # The setup action saves the Cargo cache as it finishes unless this is
          # false, which is before anything compiles. Saved at the end of the job,
          # the cache holds the compiled dependencies.
          cache-save-always: false
          # One cache for each runner and Ruby: the extension is compiled against
          # the Ruby it is built for.
          cache-version: v1-test-${{ matrix.os }}-ruby-${{ matrix.ruby }}
          # Cleaning the cache installs a prebuilt tool the action cannot fetch for
          # ARM Linux or ARM Windows: https://github.com/oxidize-rb/actions/issues/53
          cargo-cache-clean: ${{ !contains(matrix.os, 'arm') }}
      - run: bin/setup
      - run: bin/rake test
      - name: Smoke-test the packaged gem
        run: |
          bin/rake build
          # Ruby names the directory, so Windows gets a path its native programs accept.
          smoke_dir=$(ruby -rtmpdir -e "print Dir.mktmpdir")
          gem install --install-dir "$smoke_dir/gems" pkg/oxigraph-*.gem
          cd "$smoke_dir"
          GEM_HOME="$smoke_dir/gems" GEM_PATH="$smoke_dir/gems" BUNDLE_GEMFILE="" ruby -e '
            require "oxigraph"
            abort "not loaded from the installed gem" unless Gem.loaded_specs.key?("oxigraph")
            abort "a new store is not empty" unless Oxigraph::Store.new.empty?
          '
