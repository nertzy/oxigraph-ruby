---
name: Build gems

on:
  push:
    tags:
      - "v*"
      - "cross-gem/*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-data:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        id: fetch
        with:
          # arm-linux-musl is left out because no rb-sys cross-compilation
          # image is published for it.
          supported-ruby-platforms: |
            exclude: ["arm-linux", "arm-linux-musl", "x64-mingw32"]

  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cargo-cache: true
          # The setup action saves the Cargo cache as it finishes unless this is
          # false, which is before anything compiles. Saved at the end of the job,
          # the cache holds the compiled dependencies.
          cache-save-always: false
          cache-version: v1-source-gem

      - name: Build gem
        run: bin/rake build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-gem
          path: pkg/*.gem

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.4,4.0"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  # Proves a precompiled gem needs nothing but Ruby: it installs and loads in
  # a container that has no Rust toolchain and no C compiler.
  verify-native-gem:
    name: Install ${{ matrix.platform }} gem on Ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ${{ matrix.runner }}
    container: ruby:${{ matrix.ruby }}-slim
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        platform: [aarch64-linux, x86_64-linux]
        include:
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: x86_64-linux
            runner: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-gem-${{ matrix.platform }}
          path: pkg

      - name: Confirm there is no toolchain to compile with
        run: |
          if command -v cargo rustc cc gcc make; then
            echo "::error::A toolchain is installed, so this job would prove nothing."
            exit 1
          fi

      - name: Install the gem
        run: |
          gem install --local --no-document pkg/*.gem > install.log 2>&1 || { cat install.log; exit 1; }
          cat install.log
          if grep -q "Building native extensions" install.log; then
            echo "::error::The gem compiled its extension instead of using the precompiled one."
            exit 1
          fi

      - name: Load the gem and use it
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ruby -e '
            require "oxigraph"
            platform = Gem::Specification.find_by_name("oxigraph").platform.to_s
            abort "installed the #{platform} gem" unless platform == ENV.fetch("PLATFORM")
            store = Oxigraph::Store.new
            store.load("<http://example.com/a> <http://example.com/p> <http://example.com/b> .", format: :n_triples)
            abort "expected one quad, found #{store.size}" unless store.size == 1
            puts "oxigraph #{Oxigraph::VERSION} (#{platform}) loaded on Ruby #{RUBY_VERSION}"
          '
